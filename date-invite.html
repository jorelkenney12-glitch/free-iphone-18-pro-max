.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }

.ticket { display: flex; flex-direction: column; gap: 20px; text-align: center; }
.top { display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 24px; }
h1 {
  font-family: var(--font-display);
  font-weight: 400;
  font-size: clamp(32px, 8vw, 44px);
  line-height: 1.1;
  margin: 0;
  color: var(--accent);
  text-wrap: balance;
}
.top p { margin: 0; color: var(--accent); max-width: 40ch; }

.perf {
  position: relative;
  height: 0;
  border-top: 2px dashed var(--line);
  margin: 0 18px;
}
.perf::before, .perf::after {
  content: "";
  position: absolute;
  top: -19px;
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--bg);
  border: 1px solid var(--line);
}
.perf::before { left: -36px; }
.perf::after { right: -36px; }

.stub {
  padding: 26px 28px 30px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 20px 24px;
}
.stub div { min-width: 0; }
dt {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 4px;
}
dd { margin: 0; font-weight: 500; overflow-wrap: anywhere; }
dl { display: contents; }

.note { margin: 0 auto; color: var(--muted); font-size: 15px; padding-inline: 4px; max-width: 52ch; text-align: center; }

.choices { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 12px; }
#yes { transition: font-size 0.2s, padding 0.2s; max-width: 100%; overflow-wrap: anywhere; }
#yes.full { flex: 1 1 100%; }
#yes.takeover {
  position: fixed;
  inset: 0;
  z-index: 20;
  width: 100%;
  height: 100%;
  max-width: none;
  border: 0;
  border-radius: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  font-size: clamp(32px, 10vw, 72px);
  font-family: var(--font-display);
  font-weight: 400;
  padding: max(24px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px));
}
#no { transition: font-size 0.2s; max-width: 100%; }
.quiet {
  font: inherit;
  font-size: 14px;
  font-weight: 400;
  background: none;
  border: 0;
  padding: 4px 2px;
  color: var(--muted);
  text-decoration: underline;
  text-underline-offset: 3px;
  align-self: flex-start;
}
.quiet:hover { color: var(--ink); }
.photo { margin: 0; border-radius: 14px; overflow: hidden; }
.photo[hidden] { display: none; }
.photo img { display: block; width: 100%; max-height: 220px; object-fit: cover; }
.editbar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
  font-family: var(--font-mono); font-size: 13px; color: var(--muted);
  border: 1px dashed var(--line); border-radius: 10px; padding: 10px 14px;
}
.editbar[hidden] { display: none; }
.editbar input[type="file"] { font: inherit; font-size: 13px; max-width: 100%; color: var(--ink); }
.editbar button { font-size: 13px; padding: 6px 12px; }
button {
  font: inherit;
  font-weight: 600;
  font-size: 16px;
  border-radius: 10px;
  padding: 12px 18px;
  cursor: pointer;
  border: 1px solid var(--line);
  background: var(--surface);
  color: var(--ink);
  transition: border-color 0.15s, background 0.15s;
}
button:hover { border-color: var(--muted); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
button.primary:hover { filter: brightness(1.06); }
button[aria-pressed="true"]:not(.primary) { border-color: var(--accent); }

.reply {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 14px;
  padding: 22px 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.reply[hidden] { display: none; }
.reply h2 { font-family: var(--font-display); font-weight: 400; font-size: 22px; margin: 0; }
.reply p { margin: 0; color: var(--muted); font-size: 15px; }
.draft {
  font-family: var(--font-mono);
  font-size: 14px;
  line-height: 1.6;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 14px 16px;
  color: var(--ink);
  user-select: all;
  overflow-wrap: anywhere;
}
.copyrow { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.status { font-size: 14px; color: var(--muted); }
.confirm {
  background: var(--surface);
  border: 1px solid var(--accent);
  border-radius: 14px;
  padding: 24px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.confirm[hidden] { display: none; }
.confirm h2 { font-family: var(--font-display); font-weight: 400; font-size: 28px; margin: 0; }
.confirm p { margin: 0; color: var(--muted); }
.phone {
  font-family: var(--font-mono);
  font-size: clamp(22px, 6vw, 30px);
  font-weight: 500;
  color: var(--accent);
  overflow-wrap: anywhere;
  user-select: all;
}
.confirm a {
  font-weight: 600;
  font-size: 15px;
  color: var(--ink);
  text-underline-offset: 3px;
}

@media (prefers-reduced-motion: no-preference) {
  .reply:not([hidden]) { animation: rise 0.25s ease-out; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
}
</style>

<main class="wrap">
  <div class="editbar" id="editbar" hidden>
    <label for="photo-input">Add a picture</label>
    <input type="file" id="photo-input" accept="image/*">
    <button type="button" id="photo-clear">Remove</button>
  </div>
  <article class="ticket">
    <figure class="photo" id="photo" hidden>
      <img id="photo-img" alt="">
    </figure>
    <div class="top">
      <h1>Would you go on a date with me, pretty? 💕</h1>
      <p>It has been a while, and I'd love to see your smile again. Let me take you out, catch up, and make you laugh. 🌷✨</p>
    </div>
  </article>

  <p class="note" id="note">Go ahead and press No 🥺 but Yes gets bigger and cuter every time ✨</p>

  <div class="choices" id="choices" role="group" aria-label="Your answer">
    <button type="button" class="primary" id="yes" data-choice="yes">Yes, I'd love to ❤️</button>
    <button type="button" id="no">No 💔</button>
    <span id="mood" aria-hidden="true" style="font-size: 30px; line-height: 1;"></span>
  </div>
  <section class="reply" id="reply" hidden aria-live="polite">
    <h2 id="reply-title"></h2>
    <p id="reply-help"></p>
    <div class="draft" id="draft"></div>
    <div class="copyrow">
      <button type="button" id="copy">Copy reply</button>
      <span class="status" id="status"></span>
    </div>
  </section>
</main>

<script>
(function () {
  var replies = {
    yes: {
      title: "Yay, it's a date! 🎀💖",
      help: "Copy this and send it to me the way you usually reach me. Change anything you like.",
      text: "Yes, I'd love to! ❤️ Let's plan it."
    },
    no: {
      title: "Thank you for answering honestly. 🌷",
      help: "Copy this if it helps, or reply in your own words. Either way is fine.",
      text: "Thanks for the invitation. I'm going to pass, but I wish you well."
    }
  };
  var panel = document.getElementById("reply");
  var title = document.getElementById("reply-title");
  var help = document.getElementById("reply-help");
  var draft = document.getElementById("draft");
  var status = document.getElementById("status");
  var buttons = document.querySelectorAll("[data-choice]");

  var yes = document.getElementById("yes");
  var no = document.getElementById("no");
  var noLabels = ["No 💔", "Are you sure? 🥺", "Really sure? 💔", "Think again 🥹", "Pretty please? 🌸", "Just one date? 🌷", "Okay, last chance 💕"];
  var moods = ["🥺", "💔", "🥹", "🌸", "🌷", "💕"];
  var mood = document.getElementById("mood");
  var noCount = 0;
  no.addEventListener("click", function () {
    noCount += 1;
    no.textContent = noLabels[Math.min(noCount, noLabels.length - 1)];
    mood.textContent = moods[(noCount - 1) % moods.length];
    no.style.fontSize = Math.max(12, 16 - noCount) + "px";
    yes.style.fontSize = Math.min(16 + noCount * 5, 40) + "px";
    yes.style.padding = (12 + noCount * 3) + "px " + (18 + noCount * 6) + "px";
    if (noCount >= 6) { yes.classList.add("full"); }
    if (noCount >= 7) {
      no.hidden = true;
      mood.hidden = true;
      yes.style.fontSize = "";
      yes.style.padding = "";
      yes.textContent = "Yes, I'd love to ❤️";
      yes.classList.add("takeover");
    }
  });

  function prepareYes() {
    yes.classList.remove("takeover");
    document.getElementById("note").hidden = true;
    document.getElementById("choices").hidden = true;
  }

  buttons.forEach(function (b) {
    b.addEventListener("click", function () {
      if (b.getAttribute("data-choice") === "yes") { prepareYes(); }
      var r = replies[b.getAttribute("data-choice")];
      title.textContent = r.title;
      help.textContent = r.help;
      draft.textContent = r.text;
      status.textContent = "";
      panel.hidden = false;
    });
  });

  /* Picture: open the page with #edit on the end to show the picker.
     To ship a picture inside the file, set PHOTO_SRC to a file name or data URI. */
  var PHOTO_SRC = "";
  var photo = document.getElementById("photo");
  var photoImg = document.getElementById("photo-img");
  var editbar = document.getElementById("editbar");
  var input = document.getElementById("photo-input");

  function setPhoto(src) {
    if (src) { photoImg.src = src; photo.hidden = false; }
    else { photoImg.removeAttribute("src"); photo.hidden = true; }
  }
  function syncEdit() { editbar.hidden = location.hash !== "#edit"; }
  syncEdit();
  window.addEventListener("hashchange", syncEdit);
  setPhoto(PHOTO_SRC);

  input.addEventListener("change", function () {
    var file = input.files && input.files[0];
    if (!file) { return; }
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var max = 900;
        var scale = Math.min(1, max / img.width);
        var c = document.createElement("canvas");
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        setPhoto(c.toDataURL("image/jpeg", 0.85));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
  document.getElementById("photo-clear").addEventListener("click", function () {
    input.value = "";
    setPhoto("");
  });

  document.getElementById("copy").addEventListener("click", function () {
    var text = draft.textContent;
    function fallback() {
      var range = document.createRange();
      range.selectNodeContents(draft);
      var sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(range);
      status.textContent = "Text selected. Copy it with your device's copy command.";
    }
    try {
      navigator.clipboard.writeText(text).then(function () {
        status.textContent = "Copied.";
      }, fallback);
    } catch (e) { fallback(); }
  });
})();
</script>
